name: Build & Publish Release

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Flouteur_Windows
          - os: ubuntu-latest
            artifact_name: Flouteur_Linux

    runs-on: ${{ matrix.os }}

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation des paquets graphiques (Linux uniquement)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Installation des dépendances Python
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter opencv-python ultralytics onnx onnxruntime pyinstaller

    - name: Compilation avec PyInstaller
      run: |
        pyinstaller --noconsole --collect-all customtkinter --clean FlouteurGUI.py

    - name: 📦 Intégration du modèle best.onnx dans le dossier final
      shell: bash
      run: |
        cp best.onnx dist/FlouteurGUI/

    - name: 🗜️ Compression du dossier en ZIP (Natif)
      shell: bash
      run: |
        cd dist
        zip -r ../${{ matrix.artifact_name }}.zip FlouteurGUI
        cd ..

    - name: Sauvegarde temporaire de l'artefact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Téléchargement des ZIPs construits
      uses: actions/download-artifact@v4

    - name: 🚀 Publication automatique sur GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Flouteur Vidéo Pro - Dernière Version"
        body: |
          ### 🚀 Maintien automatique de l'application
          - Contient l'exécutable et le modèle IA `best.onnx` intégré.
          - Téléchargez simplement l'archive correspondant à votre système (Windows ou Linux), extrayez-la et lancez l'application !
        files: |
          Flouteur_Windows/*.zip
          Flouteur_Linux/*.zip
        overwrite: true
        prerelease: false