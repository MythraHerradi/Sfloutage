name: Générateur d'Applications (Windows & Linux)

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Flouteur_Windows_App
          - os: ubuntu-20.04 # 🔥 LE SECRET EST ICI : On compile sur un vieux noyau pour une compatibilité universelle
            artifact_name: Flouteur_Linux_App

    runs-on: ${{ matrix.os }}

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation des paquets graphiques (Linux uniquement)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Installation des dépendances Python
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter opencv-python ultralytics onnx onnxruntime pyinstaller

    - name: Compilation avec PyInstaller
      run: |
        pyinstaller --noconsole --collect-all customtkinter FlouteurGUI.py

    - name: Sauvegarde du logiciel compilé
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/FlouteurGUI/